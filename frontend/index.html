
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doraemon AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- AUTHENTICATION SCREEN -->
<section id="authScreen" class="auth-screen">
    <div class="auth-card">

        <h1>◉ Doraemon</h1>
        <p class="auth-subtitle">Your personal family AI assistant</p>

        <div class="auth-tabs">
            <button type="button" id="showLoginButton" class="auth-tab active">
                Login
            </button>

            <button type="button" id="showRegisterButton" class="auth-tab">
                Sign Up
            </button>
        </div>

        <form id="loginForm">
            <h2>Welcome back!</h2>

            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="auth-submit">
                Login
            </button>
        </form>

        <form id="registerForm" hidden>
            <h2>Create your account</h2>

            <input
                type="text"
                id="registerUsername"
                placeholder="Choose a username"
                autocomplete="username"
                minlength="3"
                maxlength="30"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password (minimum 8 characters)"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit" class="auth-submit">
                Create Account
            </button>
        </form>

        <p id="authMessage" class="auth-message"></p>

    </div>
</section>


<!-- MAIN CHAT APPLICATION -->
<div class="app" id="app" hidden>

    <aside class="sidebar">

        <h2>◉ Doraemon</h2>

        <button class="new-chat" onclick="clearChat()">
            + New Chat
        </button>

        <p class="sidebar-label">CHAT HISTORY</p>

        <div id="historyList" class="history-list"></div>

        <div class="sidebar-bottom">
            <span id="currentUsername"></span>
            <button id="logoutButton" class="logout-button">
                Logout
            </button>
            <p>Powered by Ollama</p>
        </div>

    </aside>


    <main class="chat-area">

        <header>
            <div>
                <h3>Doraemon</h3>
                <p>Your personal AI assistant</p>
            </div>

            <span class="model">Gemma 3 · 4B</span>
        </header>

        <section class="messages" id="messages">

            <div class="welcome">
                <h1>Hey! I'm Doraemon.</h1>
                <p>What can I help you with today?</p>
            </div>

        </section>

        <form class="input-area" id="chatForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Message Doraemon..."
                autocomplete="off"
                required
            >

            <button type="submit" id="sendButton">➤</button>

        </form>

        <p class="disclaimer">
            Doraemon can make mistakes. Verify important information.
        </p>

    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
